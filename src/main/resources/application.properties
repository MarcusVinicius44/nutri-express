spring.application.name=nutri-express

# Conexão com o PostgreSQL. Os valores padrão batem com o container do enunciado:
#   docker run -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres
# Para outro banco, defina as variáveis DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza a tabela "pratos" a partir da entidade Prato
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
